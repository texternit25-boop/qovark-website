<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#050817">
  <title>QOVARK — Page not found</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050817;color:#f3f7ff;font:16px system-ui;padding:24px}
    .box{max-width:520px;padding:32px;border:1px solid #263653;border-radius:22px;background:#0c1730;text-align:center}
    a{color:#7ceaff;font-weight:700}
  </style>
</head>
<body>
  <main class="box" id="fallback">
    <h1>QOVARK</h1>
    <p>This page could not be found.</p>
    <p><a href="/">Return to QOVARK</a></p>
  </main>
  <script>
    (async () => {
      const requestedPath = window.location.pathname;
      const match = requestedPath.match(/^\/share\/(chat|message)\/([A-Za-z0-9_-]{32,64})\/?$/i);
      if (!match) return;

      try {
        // This is a dedicated public share page. Do not load qovark-workspace.html
        // or the Android app shell here.
        const response = await fetch("/share.html", { cache: "no-store" });
        if (!response.ok) throw new Error(`Share viewer returned ${response.status}`);
        let html = await response.text();
        const routeState = `<script>window.__QOVARK_SHARE_PATH__=${JSON.stringify(requestedPath)};<\/script>`;
        if (!/<\/head>/i.test(html)) throw new Error("Share viewer document is malformed");
        html = html.replace(/<\/head>/i, `${routeState}</head>`);
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        console.error("QOVARK share route could not be loaded:", error);
        const fallback = document.getElementById("fallback");
        if (fallback) {
          fallback.innerHTML = "<h1>QOVARK</h1><p>This shared content could not be opened right now.</p><p><a href='/'>Return to QOVARK</a></p>";
        }
      }
    })();
  </script>
</body>
</html>
