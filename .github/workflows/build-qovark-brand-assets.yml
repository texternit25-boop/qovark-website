name: Build QOVARK Falcon brand assets

on:
  push:
    branches: [main]
    paths:
      - "qovark-falcon.svg"
      - ".github/workflows/build-qovark-brand-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qovark-brand-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out QOVARK website
        uses: actions/checkout@v4

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Extract the Falcon source artwork
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const svg = fs.readFileSync("qovark-falcon.svg", "utf8");
          const match = svg.match(/xlink:href="data:image\/webp;base64,([^"]+)"/);
          if (!match) throw new Error("Falcon WebP source is missing from qovark-falcon.svg");
          const image = Buffer.from(match[1], "base64");
          if (image.length < 1000 || image.subarray(0, 4).toString() !== "RIFF" ||
              image.subarray(8, 12).toString() !== "WEBP") {
            throw new Error("Embedded Falcon artwork is not a valid WebP image");
          }
          fs.writeFileSync("/tmp/qovark-falcon-source.webp", image);
          NODE
          magick identify /tmp/qovark-falcon-source.webp

      - name: Generate all QOVARK logo and icon sizes
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=/tmp/qovark-falcon-source.webp

          magick "$SOURCE" -filter Lanczos -resize 64x64 qovark-logo-64.png
          magick "$SOURCE" -filter Lanczos -resize 128x128 qovark-logo-128.png
          magick "$SOURCE" -filter Lanczos -resize 256x256 qovark-logo-256.png
          magick "$SOURCE" -filter Lanczos -resize 512x512 qovark-logo.png
          magick "$SOURCE" -filter Lanczos -resize 512x512 qovark-emblem-master.png

          magick "$SOURCE" -filter Lanczos -resize 48x48 qovark-favicon-48.png
          magick "$SOURCE" -filter Lanczos -resize 96x96 qovark-favicon-96.png

          magick "$SOURCE" -filter Lanczos -resize 192x192 qovark-icon-192.png
          magick "$SOURCE" -filter Lanczos -resize 512x512 qovark-icon-512.png
          magick "$SOURCE" -filter Lanczos -resize 180x180 apple-touch-icon.png

          magick \
            \( "$SOURCE" -filter Lanczos -resize 16x16 \) \
            \( "$SOURCE" -filter Lanczos -resize 32x32 \) \
            \( "$SOURCE" -filter Lanczos -resize 48x48 \) \
            favicon.ico

          echo "Generated image dimensions:"
          identify qovark-logo.png qovark-logo-64.png qovark-logo-128.png \
            qovark-logo-256.png qovark-emblem-master.png \
            qovark-favicon-48.png qovark-favicon-96.png \
            qovark-icon-192.png qovark-icon-512.png apple-touch-icon.png favicon.ico

      - name: Commit generated brand assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qovark-logo.png qovark-logo-64.png qovark-logo-128.png \
            qovark-logo-256.png qovark-emblem-master.png \
            qovark-favicon-48.png qovark-favicon-96.png \
            qovark-icon-192.png qovark-icon-512.png \
            apple-touch-icon.png favicon.ico
          if git diff --cached --quiet; then
            echo "Generated icons already match repository files."
            exit 0
          fi
          git commit -m "Generate QOVARK Falcon logo and icon sizes"
          git push
